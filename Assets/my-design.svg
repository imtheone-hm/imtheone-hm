<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">

  <defs>

    <!-- =========================
         COLORS
    ========================== -->

    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="48%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <linearGradient id="cyanPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1023"/>
      <stop offset="100%" stop-color="#070a16"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="70%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#172554" stop-opacity=".8"/>
      <stop offset="55%" stop-color="#0b1023" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#03050d" stop-opacity="1"/>
    </radialGradient>


    <!-- =========================
         GLOW EFFECTS
    ========================== -->

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>


    <!-- =========================
         BACKGROUND GRID
    ========================== -->

    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">

      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#334155"
        stroke-opacity=".12"/>

    </pattern>


    <!-- =========================
         ANIMATIONS
    ========================== -->

    <style>

      .mono {
        font-family: "Courier New", monospace;
      }

      .sans {
        font-family: Arial, sans-serif;
      }

      .cyan {
        fill: #22d3ee;
      }

      .purple {
        fill: #c084fc;
      }

      .pink {
        fill: #e879f9;
      }

      .white {
        fill: #e5e7eb;
      }

      .muted {
        fill: #94a3b8;
      }

      .green {
        fill: #4ade80;
      }


      /* Neon pulse */

      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
        transform-origin: center;
      }


      /* Floating cards */

      .float1 {
        animation: float 5s ease-in-out infinite;
      }

      .float2 {
        animation: float 6.5s ease-in-out infinite reverse;
      }


      /* Cursor */

      .blink {
        animation: blink 1s steps(2,end) infinite;
      }


      /* Moving neon lines */

      .dash {
        animation: dash 3s linear infinite;
      }


      /* Rotating rings */

      .spin {
        animation: spin 18s linear infinite;
        transform-origin: 860px 355px;
      }

      .spin2 {
        animation: spin 12s linear infinite reverse;
        transform-origin: 860px 355px;
      }


      /* Typing */

      .typing1 {
        animation: type1 7s steps(28,end) infinite;
      }

      @keyframes pulse {

        0%,100% {
          opacity: .55;
        }

        50% {
          opacity: 1;
        }

      }


      @keyframes float {

        0%,100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }

      }


      @keyframes blink {

        50% {
          opacity: 0;
        }

      }


      @keyframes dash {

        to {
          stroke-dashoffset: -80;
        }

      }


      @keyframes spin {

        to {
          transform: rotate(360deg);
        }

      }


      @keyframes type1 {

        0%,8% {
          width: 0;
        }

        30%,72% {
          width: 28ch;
        }

        80%,100% {
          width: 0;
        }

      }

    </style>

  </defs>


